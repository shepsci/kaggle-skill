[project]
name = "kaggle-skill"
version = "2.5.1"
description = "Unified Kaggle skill for agentic systems: CLI, MCP, forums, writeups, benchmarks, notebooks, datasets, competitions, and badges"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# What the skill's scripts import or call. The same floors are in the
# compatibility field of skills/kaggle/SKILL.md.
dependencies = [
    "kaggle>=2.2.4",
    "kagglehub>=1.0.2",
    "requests>=2.32.4",
]

[project.optional-dependencies]
benchmarks = [
    "kaggle-benchmarks>=0.6",
]
dev = [
    "ruff>=0.16.9,<0.17",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "skills-ref>=0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# This project is a skill folder, not an importable package. Nothing is put in
# the wheel; `pip install .` installs the dependencies.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
target-version = "py311"
line-length = 100
# Files that are pushed to Kaggle as they are; leave their bytes alone.
extend-exclude = ["skills/kaggle/modules/badges/scripts/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls Kaggle; read-only. Run with --run-live",
    "destructive: writes to or modifies a Kaggle account",
    "manual: needs a locally installed agent CLI or a human; never run in the hermetic sandbox",
]
